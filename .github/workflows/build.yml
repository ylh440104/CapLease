name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and build tools
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" "build-tools;35.0.0" "platforms;android-35"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: caplease-debug-apk
          path: out/*.apk
          if-no-files-found: error

  kpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Fetch KernelPatch headers
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/bmax121/KernelPatch.git kp
          cd kp && git sparse-checkout set kernel
          echo "KP_DIR=$PWD" >> $GITHUB_ENV

      - name: Build KPM
        run: |
          cd kpm
          KP="$KP_DIR" TARGET_COMPILE=aarch64-linux-gnu- make
          ls -la caplease.kpm

      - name: Upload KPM
        uses: actions/upload-artifact@v4
        with:
          name: caplease-kpm
          path: kpm/caplease.kpm
          if-no-files-found: error
